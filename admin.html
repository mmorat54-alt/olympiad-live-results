<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت نتایج | المپیاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --panel:#121c30; --panel-2:#16223a; --line:#223154;
    --text:#eef1f7; --text-dim:#8d99b4; --gold:#e8b84b; --green:#4ade80; --red:#ef4444;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Vazirmatn',sans-serif; padding:20px 14px 60px; }
  .wrap{ max-width: 980px; margin:0 auto; }

  #gate{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
  .gate-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:32px 26px; width:100%; max-width:340px; text-align:center;
  }
  .gate-box h1{ font-size:16px; margin:0 0 6px; }
  .gate-box p{ font-size:12px; color:var(--text-dim); margin:0 0 20px; }
  .gate-box input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:12px;
    text-align:center;
  }
  .gate-box button, .btn{
    width:100%; padding:12px 14px; border-radius:10px; border:none; cursor:pointer;
    background:var(--gold); color:#1a1305; font-weight:700; font-family:inherit; font-size:14px;
  }
  .gate-box button:disabled{ opacity:.6; cursor:default; }
  .gate-err{ color:var(--red); font-size:12px; margin-top:10px; min-height:14px; }

  #admin{ display:none; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .top-title{ font-size:18px; font-weight:800; }
  .top-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm{
    padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-family:inherit; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .btn-sm.gold{ background:var(--gold); color:#1a1305; border-color:var(--gold); }
  .btn-sm.danger{ border-color:var(--red); color:#fca5a5; }
  .btn-sm:disabled{ opacity:.5; cursor:default; }
  input[type=file]{ display:none; }

  select{
    padding:8px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:12.5px;
  }

  .save-status{ font-size:11.5px; color:var(--green); min-height:16px; margin-bottom:14px; }
  .save-status.err{ color:#fca5a5; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:4px; }
  .tab{
    flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; font-size:13px; font-weight:600;
  }
  .tab.active{ background:var(--gold); border-color:var(--gold); color:#1a1305; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h3{ margin:0 0 12px; font-size:14px; }

  .row{ display:grid; grid-template-columns: 1.6fr .8fr .6fr .6fr .6fr .6fr auto; gap:8px; align-items:center; margin-bottom:8px; }
  .row input{
    width:100%; padding:8px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:12.5px;
  }
  .col-head{ display:grid; grid-template-columns: 1.6fr .8fr .6fr .6fr .6fr .6fr auto; gap:8px; font-size:10.5px; color:var(--text-dim); margin-bottom:6px; padding:0 2px; }
  .del-btn{
    background:none; border:1px solid var(--red); color:#fca5a5; border-radius:8px; cursor:pointer;
    padding:8px 10px; font-size:11px;
  }
  .add-row-btn{ margin-top:6px; }

  .group-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .group-card h4{ margin:0 0 10px; font-size:12.5px; color:var(--gold); }
  .g-row{ display:grid; grid-template-columns: 1.4fr .5fr .5fr .5fr .5fr .6fr .5fr .5fr auto; gap:6px; margin-bottom:6px; align-items:center; }
  .g-row input[type=text], .g-row input[type=number]{
    width:100%; padding:7px 8px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-family:inherit; font-size:11.5px;
  }
  .g-row label.q-lbl{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-dim); }
  .g-head{ display:grid; grid-template-columns: 1.4fr .5fr .5fr .5fr .5fr .6fr .5fr .5fr auto; gap:6px; font-size:9.5px; color:var(--text-dim); margin-bottom:5px; }

  .match-row{ display:grid; grid-template-columns: 1.3fr .5fr auto 1.3fr .5fr; gap:6px; align-items:center; margin-bottom:6px; }
  .match-row .vs{ text-align:center; font-size:11px; color:var(--text-dim); }
  .match-row input{
    padding:7px 8px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-family:inherit; font-size:11.5px; width:100%;
  }
  .match-extra{ grid-column: 1 / -1; margin-top:4px; }
  .match-extra input{ font-size:10.5px; }
  .subhead{ font-size:11px; color:var(--text-dim); margin: 14px 0 8px; }

  .clock-box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px; }
  .clock-display{ font-size:12px; margin-bottom:8px; }
  .clock-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .clock-btns .btn-sm{ flex:0 0 auto; }
  .half-dur-lbl{ font-size:11px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px; }
  .half-dur-lbl input{ padding:7px 8px; border-radius:7px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:11.5px; }

  @media (max-width: 720px){
    .row, .col-head{ grid-template-columns: 1fr 1fr; }
    .col-head span:nth-child(n+3){ display:none; }
    .row input:nth-child(n+3){ grid-column: span 1; }
    .g-row, .g-head{ grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <h1>پنل مدیریت نتایج المپیاد</h1>
      <p>برای ورود، رمز عبور را وارد کنید</p>
      <input id="pwInput" type="password" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')tryLogin()">
      <button id="loginBtn" onclick="tryLogin()">ورود</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <div id="admin" class="wrap">
    <div class="top-row">
      <div class="top-title">پنل مدیریت نتایج</div>
      <div class="top-actions">
        <button class="btn-sm" onclick="reloadFromGithub()">🔄 بارگذاری مجدد</button>
        <button class="btn-sm gold" id="saveBtn" onclick="saveToGithub()">💾 ذخیره روی گیت‌هاب</button>
        <button class="btn-sm danger" onclick="doLogout()">خروج</button>
      </div>
    </div>
    <div class="save-status" id="saveStatus"></div>

    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>

<script>
  let DATA = { teams: [], sports: [], liveFeed: [] };
  let CURRENT_SHA = null;

  async function tryLogin(){
    const val = document.getElementById('pwInput').value;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    document.getElementById('gateErr').textContent = '';
    try{
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ password: val })
      });
      const json = await res.json();
      if (json.ok){
        document.getElementById('gate').style.display = 'none';
        document.getElementById('admin').style.display = 'block';
        await init();
      } else {
        document.getElementById('gateErr').textContent = json.error || 'رمز عبور اشتباه است';
      }
    }catch(e){
      document.getElementById('gateErr').textContent = 'خطا در اتصال به سرور';
    }
    btn.disabled = false;
  }

  async function doLogout(){
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  }

  function status(msg, isErr){
    const el = document.getElementById('saveStatus');
    el.className = 'save-status' + (isErr ? ' err' : '');
    el.textContent = msg;
    setTimeout(() => { if (el.textContent === msg) el.textContent=''; }, 5000);
  }

  async function init(){
    await reloadFromGithub();
  }

  async function reloadFromGithub(){
    status('در حال بارگذاری از گیت‌هاب...');
    try{
      const res = await fetch('/api/get-data');
      const json = await res.json();
      if (!json.ok){
        status(json.error || 'خطا در بارگذاری', true);
        return;
      }
      DATA = json.data;
      if (!DATA.liveFeed) DATA.liveFeed = [];
      CURRENT_SHA = json.sha;
      buildTabs();
      status('دیتا بارگذاری شد.');
    }catch(e){
      status('خطا در اتصال به سرور', true);
    }
  }

  async function saveToGithub(){
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    status('در حال ذخیره روی گیت‌هاب...');
    try{
      const res = await fetch('/api/save-data', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ data: DATA, sha: CURRENT_SHA })
      });
      const json = await res.json();
      if (!json.ok){
        status(json.error || 'خطا در ذخیره', true);
        btn.disabled = false;
        return;
      }
      CURRENT_SHA = json.newSha;
      status('✅ با موفقیت روی گیت‌هاب ذخیره شد.');
    }catch(e){
      status('خطا در اتصال به سرور', true);
    }
    btn.disabled = false;
  }

  function buildTabs(){
    const tabsEl = document.getElementById('tabs');
    const panelsEl = document.getElementById('panels');
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = '';

    const tabDefs = [
      { key: 'leaderboard', label: 'رتبه‌بندی کلی' },
      { key: 'livefeed', label: 'نتایج زنده' }
    ].concat(DATA.sports.map(s => ({ key: s.key, label: s.label })));

    tabDefs.forEach((t, i) => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (i===0 ? ' active' : '');
      tab.textContent = t.label;
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-'+t.key).classList.add('active');
      };
      tabsEl.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'panel' + (i===0 ? ' active' : '');
      panel.id = 'panel-'+t.key;
      panelsEl.appendChild(panel);
    });

    renderLeaderboardPanel();
    renderLiveFeedPanel();
    DATA.sports.forEach(sport => renderSportPanel(sport));
  }

  function renderLeaderboardPanel(){
    const panel = document.getElementById('panel-leaderboard');
    panel.innerHTML = `
      <div class="card">
        <h3>تیم‌ها و مدال‌ها</h3>
        <div class="col-head"><span>نام دانشگاه</span><span>منطقه</span><span>طلا</span><span>نقره</span><span>برنز</span><span>امتیاز</span><span></span></div>
        <div id="teamRows"></div>
        <button class="btn-sm add-row-btn" onclick="addTeam()">+ افزودن تیم</button>
      </div>
    `;
    renderTeamRows();
  }

  function renderTeamRows(){
    const box = document.getElementById('teamRows');
    box.innerHTML = '';
    DATA.teams.forEach((t, idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <input type="text" value="${esc(t.name)}" oninput="DATA.teams[${idx}].name=this.value">
        <input type="text" value="${esc(t.sub)}" oninput="DATA.teams[${idx}].sub=this.value">
        <input type="number" value="${t.gold}" oninput="DATA.teams[${idx}].gold=Number(this.value)">
        <input type="number" value="${t.silver}" oninput="DATA.teams[${idx}].silver=Number(this.value)">
        <input type="number" value="${t.bronze}" oninput="DATA.teams[${idx}].bronze=Number(this.value)">
        <input type="number" value="${t.points}" oninput="DATA.teams[${idx}].points=Number(this.value)">
        <button class="del-btn" onclick="removeTeam(${idx})">حذف</button>
      `;
      box.appendChild(row);
    });
  }
  function addTeam(){
    DATA.teams.push({ name:'دانشگاه جدید', sub:'', gold:0, silver:0, bronze:0, points:0 });
    renderTeamRows();
  }
  function removeTeam(idx){
    DATA.teams.splice(idx,1);
    renderTeamRows();
  }

  /* ================= LIVE FEED PANEL ================= */
  function computeElapsedSecondsAdmin(m){
    let sec = m.clockBaseSeconds || 0;
    if (m.clockRunning && m.clockStartedAt){
      sec += (Date.now() - new Date(m.clockStartedAt).getTime()) / 1000;
    }
    return Math.max(0, Math.floor(sec));
  }

  function renderLiveFeedPanel(){
    if (!DATA.liveFeed) DATA.liveFeed = [];
    const panel = document.getElementById('panel-livefeed');
    panel.innerHTML = `
      <div class="card">
        <h3>بازی‌های زنده و پیش رو</h3>
        <p style="font-size:11.5px;color:var(--text-dim);margin:0 0 12px;">هر بازی را اضافه کنید، وضعیتش را انتخاب کنید و برای بازی‌های زنده از دکمه‌های ساعت برای شروع/توقف استفاده کنید. بعد از هر تغییر «ذخیره روی گیت‌هاب» را بزنید تا تماشاگران ببینند.</p>
        <div id="feedRows"></div>
        <button class="btn-sm add-row-btn" onclick="addFeedItem()">+ افزودن بازی</button>
      </div>
    `;
    renderFeedRows();
  }

  function renderFeedRows(){
    const box = document.getElementById('feedRows');
    box.innerHTML = '';
    DATA.liveFeed.forEach((m, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'group-card';

      let scoreFieldsHTML = '';
      if (m.status === 'upcoming'){
        scoreFieldsHTML = `
          <input type="text" placeholder="زمان شروع (مثلاً ۱۶:۳۰)" value="${esc(m.time||'')}" oninput="DATA.liveFeed[${idx}].time=this.value">
        `;
      } else {
        scoreFieldsHTML = `
          <input type="number" placeholder="امتیاز تیم ۱" value="${m.score1 ?? 0}" oninput="DATA.liveFeed[${idx}].score1=Number(this.value)">
          <input type="number" placeholder="امتیاز تیم ۲" value="${m.score2 ?? 0}" oninput="DATA.liveFeed[${idx}].score2=Number(this.value)">
        `;
      }

      let clockControlsHTML = '';
      if (m.status === 'live'){
        const elapsedMin = Math.floor(computeElapsedSecondsAdmin(m) / 60);
        clockControlsHTML = `
          <div class="clock-box">
            <div class="clock-display">دقیقه فعلی: <b>${elapsedMin}′</b> — ${m.clockRunning ? 'در حال اجرا' : 'متوقف'} — نیمه ${m.half === 2 ? 'دوم' : 'اول'}</div>
            <div class="clock-btns">
              <button class="btn-sm gold" onclick="clockStart(${idx})">▶ شروع / ادامه</button>
              <button class="btn-sm" onclick="clockPause(${idx})">⏸ توقف (بین نیمه)</button>
              <button class="btn-sm" onclick="clockSecondHalf(${idx})">🔁 شروع نیمه دوم</button>
              <button class="btn-sm danger" onclick="clockReset(${idx})">🔄 صفر کردن ساعت</button>
            </div>
            <label class="half-dur-lbl" style="margin-top:8px; max-width:200px;">
              مدت هر نیمه (دقیقه)
              <input type="number" value="${m.halfDurationMinutes ?? 20}" oninput="DATA.liveFeed[${idx}].halfDurationMinutes=Number(this.value)">
            </label>
          </div>
        `;
      }

      const scorersHTML = (m.scorers||[]).map((s, si) => `
        <div class="g-row" style="grid-template-columns: .8fr 1.4fr .6fr auto;">
          <select onchange="DATA.liveFeed[${idx}].scorers[${si}].team=Number(this.value)">
            <option value="1" ${s.team===1?'selected':''}>${esc(m.team1)||'تیم ۱'}</option>
            <option value="2" ${s.team===2?'selected':''}>${esc(m.team2)||'تیم ۲'}</option>
          </select>
          <input type="text" placeholder="نام بازیکن" value="${esc(s.name)}" oninput="DATA.liveFeed[${idx}].scorers[${si}].name=this.value">
          <input type="number" placeholder="دقیقه" value="${s.minute ?? 0}" oninput="DATA.liveFeed[${idx}].scorers[${si}].minute=Number(this.value)">
          <button class="del-btn" onclick="removeScorer(${idx},${si})">حذف</button>
        </div>
      `).join('');

      wrap.innerHTML = `
        <div class="g-row" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <input type="text" placeholder="رشته (مثلاً فوتسال)" value="${esc(m.sport)}" oninput="DATA.liveFeed[${idx}].sport=this.value">
          <input type="text" placeholder="تیم ۱" value="${esc(m.team1)}" oninput="DATA.liveFeed[${idx}].team1=this.value; renderFeedRows();">
          <input type="text" placeholder="تیم ۲" value="${esc(m.team2)}" oninput="DATA.liveFeed[${idx}].team2=this.value; renderFeedRows();">
          <select onchange="setFeedStatus(${idx}, this.value)">
            <option value="upcoming" ${m.status==='upcoming'?'selected':''}>به‌زودی</option>
            <option value="live" ${m.status==='live'?'selected':''}>در حال برگزاری</option>
            <option value="finished" ${m.status==='finished'?'selected':''}>پایان یافته</option>
          </select>
        </div>
        <div class="g-row" style="grid-template-columns: 1fr 1fr; margin-top:6px;">
          ${scoreFieldsHTML}
        </div>
        ${clockControlsHTML}
        <div class="subhead">زننده‌های گل (نام و دقیقه)</div>
        ${scorersHTML}
        <button class="btn-sm" onclick="addScorer(${idx})">+ افزودن گل</button>
        <div class="g-row" style="grid-template-columns: 1fr auto; margin-top:10px;">
          <input type="text" placeholder="توضیح تکمیلی (اختیاری)" value="${esc(m.note||'')}" oninput="DATA.liveFeed[${idx}].note=this.value">
          <button class="del-btn" onclick="removeFeedItem(${idx})">حذف کل بازی</button>
        </div>
      `;
      box.appendChild(wrap);
    });
  }

  function setFeedStatus(idx, val){
    DATA.liveFeed[idx].status = val;
    if (val === 'live'){
      DATA.liveFeed[idx].half = DATA.liveFeed[idx].half || 1;
      DATA.liveFeed[idx].halfDurationMinutes = DATA.liveFeed[idx].halfDurationMinutes || 20;
    }
    renderFeedRows();
  }

  function addFeedItem(){
    DATA.liveFeed.push({
      sport:'', team1:'', team2:'', status:'upcoming', time:'',
      score1:0, score2:0, half:1, halfDurationMinutes:20,
      clockRunning:false, clockBaseSeconds:0, clockStartedAt:null,
      scorers: [], note:''
    });
    renderFeedRows();
  }
  function removeFeedItem(idx){
    DATA.liveFeed.splice(idx,1);
    renderFeedRows();
  }
  function addScorer(idx){
    if (!DATA.liveFeed[idx].scorers) DATA.liveFeed[idx].scorers = [];
    DATA.liveFeed[idx].scorers.push({ team:1, name:'', minute:0 });
    renderFeedRows();
  }
  function removeScorer(idx, si){
    DATA.liveFeed[idx].scorers.splice(si,1);
    renderFeedRows();
  }

  function clockStart(idx){
    const m = DATA.liveFeed[idx];
    if (!m.clockRunning){
      m.clockStartedAt = new Date().toISOString();
      m.clockRunning = true;
    }
    renderFeedRows();
  }
  function clockPause(idx){
    const m = DATA.liveFeed[idx];
    if (m.clockRunning){
      m.clockBaseSeconds = computeElapsedSecondsAdmin(m);
      m.clockRunning = false;
      m.clockStartedAt = null;
    }
    renderFeedRows();
  }
  function clockSecondHalf(idx){
    DATA.liveFeed[idx].half = 2;
    renderFeedRows();
  }
  function clockReset(idx){
    const m = DATA.liveFeed[idx];
    m.clockBaseSeconds = 0;
    m.clockStartedAt = null;
    m.clockRunning = false;
    m.half = 1;
    renderFeedRows();
  }

  /* ================= SPORT PANEL (groups + bracket) ================= */
  function renderSportPanel(sport){
    const panel = document.getElementById('panel-'+sport.key);
    const groupNames = Object.keys(sport.groups);

    let groupsHTML = groupNames.map(gName => {
      const rows = sport.groups[gName];
      let rowsHTML = rows.map((r, ri) => `
        <div class="g-row">
          <input type="text" value="${esc(r.name)}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'name',this.value)">
          <input type="number" value="${r.p}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'p',Number(this.value))">
          <input type="number" value="${r.w}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'w',Number(this.value))">
          <input type="number" value="${r.d}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'d',Number(this.value))">
          <input type="number" value="${r.l}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'l',Number(this.value))">
          <input type="text" value="${esc(r.diff)}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'diff',this.value)">
          <input type="number" value="${r.pts}" oninput="setGroupField('${sport.key}','${esc(gName)}',${ri},'pts',Number(this.value))">
          <label class="q-lbl"><input type="checkbox" ${r.q?'checked':''} onchange="setGroupField('${sport.key}','${esc(gName)}',${ri},'q',this.checked)"> صعود</label>
          <button class="del-btn" onclick="removeGroupRow('${sport.key}','${esc(gName)}',${ri})">حذف</button>
        </div>
      `).join('');
      return `
        <div class="group-card">
          <h4>${esc(gName)}</h4>
          <div class="g-head"><span>تیم</span><span>ب</span><span>برد</span><span>تساوی</span><span>باخت</span><span>تفاضل</span><span>امتیاز</span><span>صعود</span><span></span></div>
          ${rowsHTML}
          <button class="btn-sm" onclick="addGroupRow('${sport.key}','${esc(gName)}')">+ افزودن تیم به ${esc(gName)}</button>
        </div>
      `;
    }).join('');

    function matchRowsHTML(arr, stage){
      return arr.map((m, mi) => `
        <div class="match-row">
          <input type="text" value="${esc(m[0])}" placeholder="تیم ۱" oninput="setMatchField('${sport.key}','${stage}',${mi},0,this.value)">
          <input type="number" value="${m[2]}" placeholder="امتیاز" oninput="setMatchField('${sport.key}','${stage}',${mi},2,Number(this.value))">
          <span class="vs">در برابر</span>
          <input type="text" value="${esc(m[1])}" placeholder="تیم ۲" oninput="setMatchField('${sport.key}','${stage}',${mi},1,this.value)">
          <input type="number" value="${m[3]}" placeholder="امتیاز" oninput="setMatchField('${sport.key}','${stage}',${mi},3,Number(this.value))">
          <div class="match-extra"><input type="text" value="${esc(m[4]||'')}" placeholder="توضیح تکمیلی (مثل نتیجه پنالتی)" oninput="setMatchField('${sport.key}','${stage}',${mi},4,this.value)"></div>
        </div>
      `).join('');
    }

    panel.innerHTML = `
      <div class="card">
        <h3>${esc(sport.label)} — مرحله گروهی</h3>
        ${groupsHTML}
      </div>
      <div class="card">
        <h3>${esc(sport.label)} — مرحله حذفی</h3>
        <div class="subhead">یک‌چهارم نهایی</div>
        ${matchRowsHTML(sport.qf, 'qf')}
        <div class="subhead">نیمه‌نهایی</div>
        ${matchRowsHTML(sport.sf, 'sf')}
        <div class="subhead">فینال</div>
        ${matchRowsHTML([sport.final], 'final')}
      </div>
    `;
  }

  function findSport(key){ return DATA.sports.find(s => s.key === key); }

  function setGroupField(sportKey, groupName, idx, field, value){
    const sport = findSport(sportKey);
    sport.groups[groupName][idx][field] = value;
  }
  function addGroupRow(sportKey, groupName){
    const sport = findSport(sportKey);
    sport.groups[groupName].push({ name:'تیم جدید', p:0, w:0, d:0, l:0, diff:'0', pts:0 });
    renderSportPanel(sport);
    reactivateTab(sportKey);
  }
  function removeGroupRow(sportKey, groupName, idx){
    const sport = findSport(sportKey);
    sport.groups[groupName].splice(idx,1);
    renderSportPanel(sport);
    reactivateTab(sportKey);
  }
  function setMatchField(sportKey, stage, idx, pos, value){
    const sport = findSport(sportKey);
    if (stage === 'final'){ sport.final[pos] = value; }
    else { sport[stage][idx][pos] = value; }
  }
  function reactivateTab(sportKey){
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    document.getElementById('panel-'+sportKey).classList.add('active');
  }

  function esc(str){
    return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
